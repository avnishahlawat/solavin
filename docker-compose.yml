version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: solavin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: solavin
      POSTGRES_PASSWORD: solavin_secure_password
      POSTGRES_DB: solavin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solavin"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: solavin-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGIN: "*"
      DATABASE_URL: "postgresql://solavin:solavin_secure_password@postgres:5432/solavin?schema=public"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: solavin-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  postgres_data:
